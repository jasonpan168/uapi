name: Bug report
description: 报告可复现的问题（安全漏洞请勿使用此模板）
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请移除 API Key、密码、Cookie、助记词、私钥、用户数据和生产日志中的敏感信息。安全漏洞请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: 版本或提交号
      placeholder: e.g. main@abcdef0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: PHP、MySQL/MariaDB、Web 服务器、浏览器及操作系统版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现重复报告。
          required: true
        - label: 我已移除所有密钥、个人信息与生产数据。
          required: true
        - label: 这不是需要私下披露的安全漏洞。
          required: true
